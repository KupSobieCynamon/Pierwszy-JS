<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <button onclick="addPoint()">+1</button>
            <button onclick="resetCounter()">Zresetuj</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <!-- TODO: dodaj przycisk uruchamiający losowanie -->
             <button onclick="losowanie()">Kliknij, aby losować</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <!-- TODO: osadź zewnętrzny widget za pomocą iframe -->
             <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d118932.27288587748!2d-157.88362909452118!3d21.32549234334121!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7c00183b8cc3464d%3A0x4b28f55ff3a7976c!2sHonolulu%2C%20Hawaje%2C%20Stany%20Zjednoczone!5e0!3m2!1spl!2spl!4v1794246061921!5m2!1spl!2spl" width="200" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
